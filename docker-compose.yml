services:
  app:
    build:
      context: ./cathyinference
      dockerfile: Dockerfile
    expose:
      - "8000"
      - "8001"

  kong:
    image: kong:3.8
    container_name: kong-gateway
    environment:
      # Core Kong mode
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001

      ####### ENV-VAR SECRETS FOR KONG #######
      # RS256 public key that verifies tokens
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        ${JWT_PUBLIC_KEY_CONTENTS}
        -----END PUBLIC KEY-----
      # Redis password (optional but recommended)
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Kong rate limits
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}

    volumes:
      - ./kong/kong.yaml:/kong/declarative/kong.yaml:ro
    ports:
      - "8080:8000"  # API entrypoint
      - "8001:8001"  # Kong Admin (dev only!)
    depends_on:
      - app
      - redis

  redis:
    image: redis:7-alpine
    container_name: kong-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"